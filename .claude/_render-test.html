<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Render-Prüfstand (nur lokal)</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
</head>
<body class="theme-overview">
<div class="bg-fade-layer" id="bg-fade-a"></div>
<div class="bg-fade-layer" id="bg-fade-b"></div>
<div id="hinweis-oben" hidden><span class="hinweis-txt"></span><button type="button" class="hinweis-akt"></button></div>
<div id="login-screen" class="overlay-screen" style="display:none"><button onclick="signIn()">Login</button></div>
<div id="loading" class="overlay-screen"><div class="spin"></div><p class="ld-txt">lädt…</p></div>
<div id="err-screen" class="overlay-screen" style="display:none"><p class="err-msg" id="err-txt"></p></div>
<div id="app">
  <div id="tab-container">
    <section id="screen-overview"   class="screen"></section>
    <section id="screen-herz"       class="screen"></section>
    <section id="screen-schlaf"     class="screen"></section>
    <section id="screen-training"   class="screen"></section>
  </div>
</div>
<nav id="bottom-nav">
  <button class="nav-btn active" id="nav-overview"   data-tab="overview"><span>Übersicht</span></button>
  <button class="nav-btn"        id="nav-herz"       data-tab="herz"><span>Herz</span></button>
  <button class="nav-btn"        id="nav-schlaf"     data-tab="schlaf"><span>Schlaf</span></button>
  <button class="nav-btn"        id="nav-training"   data-tab="training"><span>Training</span></button>
</nav>

<script>
// ═══════════════════════════════════════════════════════════
// Render-Prüfstand – NUR für die lokale Entwicklung.
// Ersetzt Google-OAuth und die Sheets-API durch erfundene Daten, damit sich die
// Oberfläche ohne Anmeldung prüfen lässt (lokal schlägt OAuth fehl, weil die
// REDIRECT_URI fest auf die GitHub-Pages-Adresse zeigt).
//
// Szenarien über ?scenario= :
//   normal      – vollständige Daten (Standard)
//   nodata      – letzter Tag ohne Messwerte  → Score muss "—" zeigen
//   woerror     – Workout-Sheet wirft Fehler  → Training-Tab muss Fehlerkarte zeigen
//   stale       – Daten enden vor 3 Tagen     → Banner muss warnen
//   inject      – Zellen enthalten Auszeichnungscode → darf NICHT ausgeführt werden,
//                 und Zeilen mit unsinnigem Datum müssen verworfen werden
//   dubletten   – dieselben Tage stehen mehrfach im Sheet (so wie es das Apps-Script
//                 beim Refresh erzeugen kann) → dürfen nur EINMAL gezählt werden
//
// Zusatzschalter ?auth=aus       – kein gueltiger Token: die App muss aus dem
//                 Zwischenspeicher weiterlaufen und die Hinweisleiste oben zeigen
//                 (frueher: Login-Screen, gar keine Daten).
// Zusatzschalter ?cache=behalten – den Datei-Zwischenspeicher NICHT leeren. Erst
//                 normal laden (schreibt ihn), dann damit neu laden: die App muss
//                 sofort zeichnen und im Hintergrund nachladen.
// window.__anfragen zaehlt die Netzabrufe (meta/werte/script) – damit laesst sich
// belegen, dass der Blattnamen-Zwischenspeicher die Meta-Abfragen einspart.
//
// Zusatzschalter ?raf=timer – ersetzt requestAnimationFrame durch einen Timer, damit
// sich frame-gebundene Logik auch im verdeckten Vorschau-Pane pruefen laesst.
// ═══════════════════════════════════════════════════════════
const SC = new URLSearchParams(location.search).get('scenario') || 'normal';

// Der Vorschau-Pane zeichnet nicht, wenn er verdeckt ist – requestAnimationFrame feuert
// dort nie. Logik, die daran haengt (Auto-Hide der Bottom-Nav, Blickanker beim
// Datums-Navigieren), laesst sich so nicht pruefen. Mit ?raf=timer wird nur der
// Taktgeber auf einen Timer umgestellt; der gepruefte Code bleibt unveraendert.
if (new URLSearchParams(location.search).get('raf') === 'timer') {
  window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 16);
  window.cancelAnimationFrame = id => clearTimeout(id);
}

// Service Worker abmelden und Caches leeren. Sonst liefert eine frühere Registrierung
// auf localhost weiter die ALTE app.js aus – man prüft dann ahnungslos den Vorstand.
// Beim ersten Aufruf einmal automatisch neu laden, damit die frische Datei greift.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(async regs => {
    const namen = await caches.keys();
    if (regs.length || namen.length) {
      await Promise.all([...regs.map(r => r.unregister()), ...namen.map(n => caches.delete(n))]);
      if (!sessionStorage.getItem('sw-geleert')) {
        sessionStorage.setItem('sw-geleert', '1');
        location.reload();
      }
    }
  });
}

// Anmeldung: standardmaessig gueltig. ?auth=aus simuliert den abgelaufenen Token –
// die App muss dann aus dem Zwischenspeicher weiterlaufen statt den Login zu zeigen.
const _P = new URLSearchParams(location.search);
if (_P.get('auth') === 'aus') {
  localStorage.removeItem('g_token'); localStorage.removeItem('g_expiry');
} else {
  localStorage.setItem('g_token', 'testtoken');
  localStorage.setItem('g_expiry', String(Date.now() + 3600e3));
}

// Zwischenspeicher: standardmaessig leeren, sonst startet jeder Lauf aus dem Stand
// des vorigen und die Szenarien waeren nicht mehr vergleichbar.
// ?cache=behalten laesst ihn stehen – so laesst sich der Sofortstart pruefen:
// einmal normal laden (schreibt den Speicher), dann mit ?cache=behalten neu laden.
if (_P.get('cache') !== 'behalten') {
  localStorage.removeItem('hcc_daten_v1');
  localStorage.removeItem('hcc_blattnamen_v1');
}
// Zaehler fuer die Netzanfragen – damit sich belegen laesst, dass der Blattnamen-
// Zwischenspeicher die Meta-Abfragen wirklich einspart.
window.__anfragen = { meta: 0, werte: 0, script: 0 };
// Wann stand das erste Diagramm? Misst den eigentlichen Gewinn des Zwischenspeichers.
// Ein Beobachter statt einer Abfrage nach dem Laden – nur so ist der Zeitpunkt echt.
window.__ersterChartMs = null;
new MutationObserver((_, beob) => {
  if (document.querySelector('#screen-overview canvas')) {
    window.__ersterChartMs = Math.round(performance.now());
    beob.disconnect();
  }
}).observe(document.documentElement, { childList: true, subtree: true });
// Wann kam die erste Netzantwort? Der Vergleich der beiden Zahlen ist der Beleg.
window.__ersteAntwortMs = null;
// Fruehe Momentaufnahme der Uebersicht (200 ms nach Start) – belegt, WAS aus dem
// Zwischenspeicher stand, bevor der Nachlade-Abruf zurueck war. Ohne sie racet jede
// Pruefung von aussen gegen die Antwortzeit.
window.__fruehText = null;
setTimeout(() => { window.__fruehText = (document.getElementById('screen-overview')||{}).innerText || ''; }, 200);
// ?tipp=sofort simuliert einen Nutzer, der gleich nach dem Start etwas antippt –
// waehrend das Nachladen noch laeuft. Die App darf dann NICHT still neu zeichnen,
// sondern muss die Hinweisleiste "Neue Daten geladen" anbieten. Mehrfach gesendet,
// weil app.js seinen Zuhoerer erst im Lauf des eigenen Starts anmeldet.
if (_P.get('tipp') === 'sofort') {
  const stop = setInterval(() => window.dispatchEvent(new PointerEvent('pointerdown', { bubbles:true })), 40);
  setTimeout(() => clearInterval(stop), 800);
}

function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// Deterministischer Pseudozufall, damit Läufe vergleichbar bleiben
let _seed = 42;
function rnd(){ _seed = (_seed*1103515245 + 12345) & 0x7fffffff; return _seed / 0x7fffffff; }

const N_DAYS = 120;
const endOffset = SC === 'stale' ? 3 : 0;
const health = [['date','sleepTotal','restHR','hrv','steps','activeCal','vo2max','sleepDeep','sleepRem','sleepCore','sleepAwake','sleepScore','runSpeed','distKm','sleepStart','sleepEnd']];
const workout = [['Date','Type','Duration (min)','Distance (km)','Avg HR','Max HR','Speed (km/h)','Elevation (m)','Energy (kJ)']];

for (let i = N_DAYS - 1; i >= endOffset; i--) {
  const d = new Date(); d.setDate(d.getDate() - i);
  const ds = ymd(d);
  const dow = d.getDay();
  const isLast = (i === endOffset);
  if (isLast && SC === 'nodata') { health.push([ds,'','','','','','','','','','','','','','','']); continue; }

  const sleep = 6.4 + rnd()*2.2 + (dow===0||dow===6 ? 0.5 : 0);
  const deep = sleep*0.17, rem = sleep*0.22, core = sleep*0.55, awake = sleep*0.06;
  const hrv   = 42 + rnd()*26 + i*0.05;
  const restHR= 62 - rnd()*10 - i*0.01;
  const steps = Math.round(4200 + rnd()*9000);
  const train = rnd() < 0.4;
  health.push([
    ds, sleep.toFixed(2), restHR.toFixed(1), hrv.toFixed(1), steps,
    Math.round(320 + rnd()*600), (44 + i*0.01 + rnd()*0.6).toFixed(1),
    deep.toFixed(2), rem.toFixed(2), core.toFixed(2), awake.toFixed(2),
    Math.round(62 + rnd()*33),
    train ? (9.5 + rnd()*3).toFixed(2) : '',
    train ? (4 + rnd()*8).toFixed(2) : '',
    ds + ' 23:' + String(Math.floor(rnd()*59)).padStart(2,'0'),
    ds + ' 07:' + String(Math.floor(rnd()*59)).padStart(2,'0')
  ]);
  // Jeder vierte Lauf ist ein Indoor-Lauf: die Uhr misst dort keine GPS-Geschwindigkeit,
  // im Health-Sheet bleibt runSpeed leer. Das Workout-Sheet liefert trotzdem eine
  // geschaetzte Speed. Genau der Fall, in dem die Pace frueher fehlte.
  const indoor = train && rnd() < 0.25;
  if (indoor) health[health.length-1][12] = '';
  if (train) {
    const speed = 9.5 + rnd()*3, dur = 28 + rnd()*55;
    // Bezeichnungen wie sie Apple/Health Auto Export tatsächlich liefert – inklusive
    // der eigenwilligen Übersetzungen, an denen die frühere exakte Namensliste scheiterte.
    workout.push([ds, indoor ? 'Innenräume Ausführen'
      : ['Outdoor Ausführen','Hochintensives Intervalltraining','Trail-Laufen'][Math.floor(rnd()*3)],
      dur.toFixed(1), (speed*dur/60).toFixed(2), Math.round(132+rnd()*30),
      Math.round(165+rnd()*20), speed.toFixed(2), Math.round(rnd()*260), Math.round(1200+rnd()*1600)]);
  }
}

// Angriffs-Szenario: bösartige Zellinhalte einschleusen. window.__pwned wird nur
// gesetzt, wenn der Browser den Code AUSFÜHRT statt ihn anzuzeigen – der Test prüft
// anschliessend, dass die Markierung ausgeblieben ist.
if (SC === 'inject') {
  const payload = '<img src=x onerror="window.__pwned=(window.__pwned||0)+1">';
  // 1) Trainingsart im Workout-Sheet (der naheliegendste Anzeigekandidat)
  workout.push([ymd(new Date()), payload, '42', '5.0', '140', '170', '10.0', '50', '1500']);
  // 2) Zeile mit unsinnigem Datum im Health-Sheet – muss verworfen werden
  health.push([payload, '7.5', '55', '60', '9000', '400', '45', '1.2', '1.6', '4.1', '0.4', '80', '', '', '', '']);
  // 3) Datumsspalte mit Text statt Datum
  health.push(['kein Datum', '7.0', '58', '55', '8000', '380', '45', '', '', '', '', '', '', '', '', '']);
}

// Ein Tag, an dem beide Sheets die Strecke fuehren – mit klar verschiedenen Zahlen.
// Dashboard Data muss gewinnen (Strecke, Pace), Workout Data die uebrigen Werte liefern.
if (SC === 'quellen') {
  const ds = ymd(new Date());
  const zeile = health.find(r => r[0] === ds);
  if (zeile) { zeile[13] = '7.77'; zeile[12] = '12.00'; }   // distKm, runSpeed
  workout.push([ds, 'Outdoor Ausführen', '44', '3.33', '145', '170', '6.00', '99', '1673']);
}

// Dubletten-Szenario: die letzten drei Tage stehen ein zweites Mal im Sheet – genau
// das Muster aus Leonards echtem Schlafschuld-Tooltip, wo Nächte doppelt auftauchten.
if (SC === 'dubletten') {
  const letzte = health.slice(-3).map(r => r.slice());
  letzte.forEach(r => health.push(r));
}

const HEALTH_ID = '1eZ47hJUc7yX_o-eH0p9JL3Wi34wWMQ8gSEI1a46VRKM';
const WORKOUT_ID = '1YJ3ke8Z2jS1KdJlKOnukUStMgvqqppnktAb8UVHDdgk';
// ?netz=langsam verzoegert JEDE Antwort um NETZ_MS. Damit laesst sich zeigen, was der
// Zwischenspeicher bringt: mit ihm stehen die Diagramme sofort, ohne ihn erst danach.
const NETZ_MS = _P.get('netz') === 'langsam' ? 1500 : 0;
const ok = body => new Promise(res => setTimeout(() => {
  if (window.__ersteAntwortMs === null) window.__ersteAntwortMs = Math.round(performance.now());
  res({ ok:true, status:200, json:()=>Promise.resolve(body), text:()=>Promise.resolve('') });
}, NETZ_MS));

window.fetch = (url, opt = {}) => {
  const u = String(url);
  const methode = (opt.method || 'GET').toUpperCase();

  // Apps Script: nur noch der Import-Ausloeser, jetzt per POST mit Google-Zugang im
  // Rumpf statt mit einem Passwort in der Adresse.
  if (u.includes('script.google.com')) {
    window.__anfragen.script++;
    let rumpf = {}; try { rumpf = JSON.parse(opt.body || '{}'); } catch(_) {}
    window.__refreshAufrufe = (window.__refreshAufrufe || 0) + 1;
    window.__refreshMitZugang = !!rumpf.zugang;
    window.__refreshAdresseHatPasswort = u.includes('token=');
    return ok({ ok: true });
  }

  if (u.includes('sheets.googleapis.com')) {
    const isWorkout = u.includes(WORKOUT_ID);
    const dec = decodeURIComponent(u);

    // Blattnamen
    if (u.includes('?fields=sheets')) { window.__anfragen.meta++;
      return ok({ sheets: [{ properties:{ title:'Data' } }] }); }

    // Lesen
    window.__anfragen.werte++;
    if (isWorkout && SC === 'woerror') return Promise.reject(
      new Error('Simulierter Netzwerkfehler <img src=x onerror="window.__pwned=1">'));
    return ok({ values: isWorkout ? workout : health });
  }
  return ok({});
};
// Rohdaten offenlegen, damit sich im Test nachweisen laesst, aus WELCHEM Sheet ein
// angezeigter Wert stammt (die App selbst ist eine IIFE und gibt nichts preis).
window.__health = health; window.__workout = workout;
console.log('[Prüfstand] Szenario:', SC, '· Health-Zeilen:', health.length-1, '· Workouts:', workout.length-1);
</script>
<script src="/app.js"></script>
</body>
</html>
